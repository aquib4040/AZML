# CodeRabbit Configuration File
version: "2"
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  path_filters:
    - "!**.md"
    - "!LICENSE"
    - "!.gitignore"
  path_instructions:
    - path: "bot/**"
      instructions: "Review Python code for unhandled exceptions, memory leaks, improper async/await usage, and blocking loop calls."
    - path: "web/**"
      instructions: "Ensure secure handling of web requests, parameter validation, and proper Gunicorn/Gevent integration."

chat:
  auto_reply: true
