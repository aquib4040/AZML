name: CI Bug Checker & Syntax Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    types: [ opened, synchronize, reopened ]

jobs:
  lint-and-syntax:
    name: Python Syntax & Bug Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv & Tools
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system ruff flake8

      - name: Check Python AST & Bytecode Compilation
        run: |
          python -m compileall bot web update.py

      - name: Critical Bug & Syntax Error Scan (Ruff)
        run: |
          ruff check . --select=E9,F6,F7,F8 --output-format=github
