name: Network & Code Speed Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Runs weekly on Sunday

jobs:
  speed-benchmark:
    name: Track Upload & Download Speed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv & Fast Package Installation
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system "setuptools_scm<8" vcs_versioning
          uv pip install --system -r requirements.txt

      - name: Run Speed Benchmark Pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOKEN_DC1: ${{ secrets.BOT_TOKEN_DC1 }}
          BOT_TOKEN_DC4: ${{ secrets.BOT_TOKEN_DC4 }}
          TELEGRAM_API: ${{ secrets.TELEGRAM_API }}
          TELEGRAM_HASH: ${{ secrets.TELEGRAM_HASH }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OWNER_ID_DC1: ${{ secrets.OWNER_ID_DC1 }}
          OWNER_ID_DC4: ${{ secrets.OWNER_ID_DC4 }}
        run: |
          python .github/scripts/speed_benchmark.py

      - name: Commit & Push Updated README Benchmark
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Speed Benchmark in README.md"
          file_pattern: "README.md"
